      const normUser = (username || "").toLowerCase().replace(/^@/, "").trim();
      const normPhone = (phone || "").replace(/\D/g, "");

      const matchUsername = normUser && ADMIN_CONFIG.adminUsernames.some(u => u.toLowerCase().replace(/^@/, "").trim() === normUser);

        const cleanP = p.replace(/\D/g, "");
        return (normPhone.endsWith(cleanP) || cleanP.endsWith(normPhone) || (cleanP.length >= 9 && normPhone.includes(cleanP.slice(-9))));

      const savedAdminMode = localStorage.getItem('tena_is_admin_mode') === 'true';
      return Boolean(matchUsername || matchPhone || savedAdminMode);

    function getInitialTelegramProfile() {
      let uid = 'user_' + Math.random().toString(36).substring(2, 9);
      let uname = "Friend";
      let uusername = "";
      let uphone = "";
      let uphoto = null;

      try {
        if (window.Telegram?.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();
          if (tg.initDataUnsafe?.user?.id) {
            uid = String(tg.initDataUnsafe.user.id);
          }
          if (tg.initDataUnsafe?.user?.first_name) {
            uname = tg.initDataUnsafe.user.last_name
              ? `${tg.initDataUnsafe.user.first_name} ${tg.initDataUnsafe.user.last_name}`
              : tg.initDataUnsafe.user.first_name;
          }
          if (tg.initDataUnsafe?.user?.username) {
            uusername = tg.initDataUnsafe.user.username;
          }
          if (tg.initDataUnsafe?.user?.photo_url) {
            uphoto = tg.initDataUnsafe.user.photo_url;
          }
        }
      } catch(e) {}

      const savedUid = localStorage.getItem('tena_device_uid');
      if (savedUid && uid.startsWith('user_')) {
        uid = savedUid;
      } else if (!savedUid) {
        localStorage.setItem('tena_device_uid', uid);
      }

      return { uid, uname, uusername, uphone, uphoto };
    }

              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full max-h-[85vh] flex flex-col overflow-hidden border border-slate-200 dark:border-slate-800 shadow-2xl">
                <div className="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                  <span className="text-xs font-black text-sky-600 bg-sky-50 dark:bg-sky-950 px-2.5 py-1 rounded-full">
                    📖 Digital Reader
                  </span>
                  <button onClick={() => setSelectedBook(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center text-xs font-black">
                    ✕
                  </button>
                </div>
                <div className="p-5 overflow-y-auto space-y-4">
                  <h2 className="text-base font-black text-slate-900 dark:text-white leading-snug">{selectedBook.title}</h2>
                  {selectedBook.chapters.map((ch, idx) => (
                    <div key={idx} className="p-3.5 bg-slate-50 dark:bg-slate-800/60 rounded-2xl space-y-1.5 border border-slate-200/70 dark:border-slate-700">
                      <h4 className="text-xs font-black text-slate-900 dark:text-white">{ch.title}</h4>
                      <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">{ch.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ADMIN CONTENT PANEL */}
          {showAdminPanel && (
            <div className="fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-5 space-y-4 border border-slate-200 dark:border-slate-800 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button
                  onClick={() => setShowAdminPanel(false)}
                  className="absolute right-4 top-4 w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center text-xs font-black"
                >
                  ✕
                </button>
                <h3 className="font-black text-base">👑 Tena Admin Content Manager</h3>
                <p className="text-xs text-slate-400">Manage orders, VIP members, and health protocols.</p>

                <div className="space-y-2">
                  <button
                    onClick={() => {
                      setShowAdminPanel(false);
                      setShowOrderHistoryModal(true);
                    }}
                    className="w-full p-3 bg-pink-50 dark:bg-pink-950 text-pink-600 font-bold text-xs rounded-2xl text-left flex justify-between items-center"
                  >
                    <span>Manage Orders (Approve / Review)</span>
                    <span>→</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION BAR (Tracker | Challenges | Health Hub | Store | Settings) */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-pink-100/70 dark:border-slate-800 px-2 py-2 flex items-center justify-around z-30 shadow-lg">
            
            <button
              onClick={() => setActiveTab('tracker')}
              className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${
                activeTab === 'tracker' 
                  ? 'text-pink-600 dark:text-pink-400 font-black' 
                  : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'
              }`}
            >
              <span className="text-xl">🌿</span>
              <span className="text-[10px] mt-0.5">{t.tracker}</span>
            </button>

            <button
              onClick={() => setActiveTab('challenges')}
              className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${
                activeTab === 'challenges' 
                  ? 'text-pink-600 dark:text-pink-400 font-black' 
                  : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'
              }`}
            >
              <span className="text-xl">🏆</span>
              <span className="text-[10px] mt-0.5">{t.challenges}</span>
            </button>

            <button
              onClick={() => setActiveTab('hub')}
              className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${
                activeTab === 'hub' 
                  ? 'text-pink-600 dark:text-pink-400 font-black' 
                  : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'
              }`}
            >
              <span className="text-xl">💡</span>
              <span className="text-[10px] mt-0.5">{t.hub}</span>
            </button>

            <button
              onClick={() => setActiveTab('store')}
              className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${
                activeTab === 'store' 
                  ? 'text-pink-600 dark:text-pink-400 font-black' 
                  : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'
              }`}
            >
              <span className="text-xl">🛍️</span>
              <span className="text-[10px] mt-0.5">{t.store}</span>
            </button>

            {/* SETTINGS TAB (Replaced VIP Profile tab) */}
            <button
              onClick={() => setActiveTab('settings')}
              className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${
                activeTab === 'settings' 
                  ? 'text-pink-600 dark:text-pink-400 font-black' 
                  : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'
              }`}
            >
              <span className="text-xl">⚙️</span>
              <span className="text-[10px] mt-0.5">{t.settings}</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
