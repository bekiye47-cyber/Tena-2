      var savedTheme = localStorage.getItem('tena_app_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.colorScheme === 'dark')) {

      } else {
        document.documentElement.classList.remove('dark');

    function getInitialTelegramProfile() {
      let deviceUid = localStorage.getItem('tena_device_uid');
      if (!deviceUid) {
        deviceUid = 'user_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('tena_device_uid', deviceUid);
      }

      let uid = deviceUid;
      let uname = "Friend";
      let uusername = "";
      let uphoto = null;

      // 1. Direct window.Telegram.WebApp object
      try {
        if (window.Telegram?.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();
          if (tg.initDataUnsafe?.user?.id) {
            uid = String(tg.initDataUnsafe.user.id);
          }
          if (tg.initDataUnsafe?.user?.first_name) {
            uname = tg.initDataUnsafe.user.last_name
              ? `${tg.initDataUnsafe.user.first_name} ${tg.initDataUnsafe.user.last_name}`
              : tg.initDataUnsafe.user.first_name;
          }
          if (tg.initDataUnsafe?.user?.username) {
            uusername = tg.initDataUnsafe.user.username;
          }
          if (tg.initDataUnsafe?.user?.photo_url) {
            uphoto = tg.initDataUnsafe.user.photo_url;
            localStorage.setItem(`tena_${uid}_photo`, uphoto);
          }

          // Also check raw initData if user was not parsed yet
          if (uid === deviceUid && tg.initData) {
            const params = new URLSearchParams(tg.initData);
            const userStr = params.get('user');
            if (userStr) {
              const uObj = JSON.parse(userStr);
              if (uObj.id) uid = String(uObj.id);
              if (uObj.first_name) uname = uObj.last_name ? `${uObj.first_name} ${uObj.last_name}` : uObj.first_name;
              if (uObj.username) uusername = uObj.username;
              if (uObj.photo_url) {
                uphoto = uObj.photo_url;
                localStorage.setItem(`tena_${uid}_photo`, uphoto);
              }
            }
          }
        }
      } catch(e) {}

      // 2. Parse from window.location.hash or search (#tgWebAppData=...)
      try {
        const hashStr = window.location.hash ? window.location.hash.substring(1) : '';
        const searchStr = window.location.search ? window.location.search.substring(1) : '';
        const queryCombined = new URLSearchParams(hashStr || searchStr);
        const tgWebAppData = queryCombined.get('tgWebAppData');
        if (tgWebAppData) {
          const subParams = new URLSearchParams(tgWebAppData);
          const rawUser = subParams.get('user');
          if (rawUser) {
            const uObj = JSON.parse(rawUser);
            if (uObj.id) uid = String(uObj.id);
            if (uObj.first_name) uname = uObj.last_name ? `${uObj.first_name} ${uObj.last_name}` : uObj.first_name;
            if (uObj.username) uusername = uObj.username;
            if (uObj.photo_url) {
              uphoto = uObj.photo_url;
              localStorage.setItem(`tena_${uid}_photo`, uphoto);
            }
          }
        }
      } catch(e) {}

      if (!uphoto) {
        const savedPhoto = localStorage.getItem(`tena_${uid}_photo`);
        if (savedPhoto) uphoto = savedPhoto;
      }

      return { uid, uname, uusername, uphoto };
    }

                    {t.newTierUnlocked}
                  </div>
                  <h2 className="text-xl font-black text-slate-900 dark:text-slate-100">
                    {levelUpModal.newRank.name}
                  </h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400 font-bold">
                    {levelUpModal.newRank.title || levelUpModal.newRank.name}
                  </p>
                </div>

                {/* Progression Stepper: Old Rank ➔ New Rank */}
                <div className="relative z-10 bg-slate-50 dark:bg-slate-800/80 p-3 rounded-2xl border border-slate-100 dark:border-slate-700/80 mb-4 flex items-center justify-around text-xs font-black">
                  <div className="flex flex-col items-center opacity-60">
                    <span className="text-base">{levelUpModal.oldRank?.icon || "🥉"}</span>
                    <span className="text-[10px] text-slate-400 mt-0.5">{levelUpModal.oldRank?.name || "Bronze I"}</span>
                  </div>
                  <div className="text-amber-500 font-black text-base animate-pulse">➔</div>
                  <div className="flex flex-col items-center text-teal-700 dark:text-teal-300">
                    <span className="text-xl">{levelUpModal.newRank.icon}</span>
                    <span className="text-[11px] font-black mt-0.5">{levelUpModal.newRank.name}</span>
                  </div>
                </div>

                {/* Perks Checklist */}
                <div className="relative z-10 text-left bg-teal-50/60 dark:bg-teal-950/30 p-3 rounded-2xl border border-teal-100 dark:border-teal-900/50 mb-5 space-y-1.5 text-[11px] font-bold text-slate-700 dark:text-slate-300">
                  <div className="flex items-center gap-2">
                    <span className="text-teal-600">✓</span>
                    <span>{t.benefit1}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-teal-600">✓</span>
                    <span>{t.benefit2}</span>
                  </div>
                  <div className="flex items-center gap-2 text-amber-600 dark:text-amber-400 font-black">
                    <span>🎯</span>
                    <span>{t.benefit3} {levelUpModal.newRank.next} Stars ({Math.max(0, levelUpModal.newRank.next - levelUpModal.stars)} needed)</span>
                  </div>
                </div>

                {/* Claim / Continue Button */}
                <button
                  onClick={() => {
                    setLevelUpModal(null);
                    if (typeof confetti === 'function') {
                      confetti({
                        particleCount: 30,
                        spread: 60,
                        origin: { y: 0.7 },
                        colors: ['#14b8a6', '#f59e0b', '#10b981']
                      });
                    }
                  }}
                  className="relative z-10 w-full py-3.5 bg-gradient-to-r from-teal-600 via-emerald-600 to-teal-600 hover:from-teal-700 hover:to-emerald-700 text-white font-black text-xs rounded-2xl shadow-lg shadow-teal-600/30 active:scale-95 transition"
                >
                  {t.claimReward}
                </button>
              </div>
            </div>
          )}

          {/* 5-TAB BOTTOM NAVIGATION */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200/80 dark:border-slate-800 py-2.5 px-4 flex justify-around z-40 shadow-lg">
            <button onClick={() => { setActiveTab('tracker'); setShowLeaderboardView(false); }} className={`flex flex-col items-center text-[10px] font-black ${activeTab === 'tracker' ? 'text-teal-600 dark:text-teal-400' : 'text-slate-400'}`}>
              <span className="text-base">📊</span>
              <span>{t.tracker}</span>
            </button>

            <button onClick={() => { setActiveTab('challenges'); setChallengeSubTab('ranks'); setShowLeaderboardView(false); }} className={`flex flex-col items-center text-[10px] font-black ${activeTab === 'challenges' ? 'text-teal-600 dark:text-teal-400' : 'text-slate-400'}`}>
              <span className="text-base">🏆</span>
              <span>{t.challenges}</span>
            </button>

            <button onClick={() => { setActiveTab('hub'); setShowLeaderboardView(false); }} className={`flex flex-col items-center text-[10px] font-black ${activeTab === 'hub' ? 'text-teal-600 dark:text-teal-400' : 'text-slate-400'}`}>
              <span className="text-base">📚</span>
              <span>{t.hub}</span>
            </button>

            <button onClick={() => { setActiveTab('store'); setShowLeaderboardView(false); }} className={`flex flex-col items-center text-[10px] font-black ${activeTab === 'store' ? 'text-teal-600 dark:text-teal-400' : 'text-slate-400'}`}>
              <span className="text-base">🛍️</span>
              <span>{t.store}</span>
            </button>

            <button onClick={() => { setActiveTab('profile'); setShowLeaderboardView(false); }} className={`flex flex-col items-center text-[10px] font-black ${activeTab === 'profile' ? 'text-teal-600 dark:text-teal-400' : 'text-slate-400'}`}>
              <span className="text-base">👤</span>
              <span>{t.profile}</span>
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
